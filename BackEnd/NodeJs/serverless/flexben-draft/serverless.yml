org: dayle
app: flexben
service: flexben-draft
frameworkVersion: '3'
	
plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs14.x
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: arn:aws:dynamodb:us-east-1:589520710570:table/users-table-dev

functions:
  api:
    handler: handler.handler
    events:
      - httpApi: '*'
